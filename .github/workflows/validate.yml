name: Validate skill

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check Python and JSON
        run: |
          python -m py_compile skills/run-design-sprint/scripts/sprint_workspace.py
          python -m py_compile scripts/check_publication.py
          python -m py_compile scripts/release_smoke_test.py
          python -m json.tool skills/run-design-sprint/references/artifact-specs.json > /dev/null
          python -m json.tool skills/run-design-sprint/references/method-profiles.json > /dev/null
          python -m json.tool skills/run-design-sprint/references/role-contracts.json > /dev/null
          python -m py_compile skills/run-design-sprint/scripts/schema_validation.py
          find skills tests/fixtures -name '*.json' -print0 | xargs -0 -n1 python -m json.tool > /dev/null

      - name: Compile JSON Schemas
        run: |
          schema_targets=()
          while IFS= read -r schema; do
            schema_targets+=(-s "$schema")
          done < <(find skills/run-design-sprint/references/schemas \
            -name '*-v*.schema.json' \
            ! -name 'prototype-brief-v1.schema.json' \
            ! -name 'recruitment-plan-v1.schema.json' \
            ! -name 'tested-version-v1.schema.json' \
            -print | sort)
          npx --yes ajv-cli@5.0.0 compile \
            --spec=draft2020 \
            --validate-formats=false \
            "${schema_targets[@]}" \
            -r skills/run-design-sprint/references/schemas/workspace-state.schema.json \
            -r skills/run-design-sprint/references/schemas/artifact-data.schema.json \
            -r skills/run-design-sprint/references/schemas/prototype-brief-v1.schema.json \
            -r skills/run-design-sprint/references/schemas/recruitment-plan-v1.schema.json \
            -r skills/run-design-sprint/references/schemas/tested-version-v1.schema.json
          npx --yes ajv-cli@5.0.0 compile \
            --spec=draft2020 \
            --validate-formats=false \
            -s skills/run-design-sprint/references/schemas/prototype-brief-v1.schema.json
          npx --yes ajv-cli@5.0.0 compile \
            --spec=draft2020 \
            --validate-formats=false \
            -s skills/run-design-sprint/references/schemas/recruitment-plan-v1.schema.json
          npx --yes ajv-cli@5.0.0 compile \
            --spec=draft2020 \
            --validate-formats=false \
            -s skills/run-design-sprint/references/schemas/tested-version-v1.schema.json \
            -r skills/run-design-sprint/references/schemas/prototype-brief-v1.schema.json

      - name: Check public/private evidence boundary
        run: python scripts/check_publication.py

      - name: Run workspace tests
        run: python -m unittest discover -s tests -v

      - name: Validate generated HTML
        run: |
          workspace="$RUNNER_TEMP/generated-sprint"
          python skills/run-design-sprint/scripts/sprint_workspace.py init \
            --title "CI Sprint" \
            --challenge "Validate generated HTML" \
            --selected-by "CI validation fixture" \
            --mode-reason "Exercise the generated live-mode workspace." \
            --output "$workspace"
          python skills/run-design-sprint/scripts/sprint_workspace.py render \
            --workspace "$workspace" \
            --check
          python skills/run-design-sprint/scripts/sprint_workspace.py validate \
            --workspace "$workspace"
          find "$workspace" -name '*.html' -print0 | \
            xargs -0 npx --yes html-validate@11.6.2

  python-compatibility:
    name: Python ${{ matrix.python-version }} full suite
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run full suite on supported Python
        run: python -m unittest discover -s tests -v

  platform-smoke:
    name: ${{ matrix.os }} runtime smoke
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install, discover, and run the synthetic fixture
        run: python scripts/release_smoke_test.py --source "${{ github.workspace }}"

  clean-public-install:
    name: Public install (Node ${{ matrix.node-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    env:
      RELEASE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      RELEASE_REF: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Verify clean public install and discovery
        run: |
          python scripts/release_smoke_test.py \
            --source "https://github.com/${RELEASE_REPOSITORY}/archive/${RELEASE_REF}.tar.gz" \
            --require-public-source
